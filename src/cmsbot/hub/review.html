<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMSBOT review</title>
<style>

button,input,select,textarea{font:inherit;color:inherit}

input[type=text],input[type=url],.field input[type=password]{width:100%}

.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.spacer{flex:1}
.chip:empty{display:none}.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.ok{background:var(--ok-bg);color:var(--accent)}

.row[aria-current=true]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}

.empty{color:var(--muted);padding:40px 20px;text-align:center}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.field{margin-bottom:10px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.group{border-left:2px solid var(--line);padding-left:12px;margin:6px 0 12px}
.entry{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.entry>.body{flex:1;min-width:0}
.count{font-size:11px;color:var(--muted);text-align:right}.count.over{color:var(--bad);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}

</style>
</head>

<div id="login" hidden>

  <div class="field"><label>Your name (shown on approvals)</label><input type="text" id="setupName"></div>

  <div id="setupDone"></div>
</div>
<div id="app" hidden>
<header>
  <h1>CMSBOT</h1>
  <select id="project" aria-label="Project"></select>
  <div class="tabs" id="tabs" role="tablist"></div>

  <span class="spacer"></span>
  <span class="chip" id="spend"></span>
  <button class="btn small" id="importBtn">Import published piece</button>
  <button class="btn small" id="logout">Sign out</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select an item. Keys: <b>j</b>/<b>k</b> move, <b>Ctrl+Enter</b> approve.</div></div>
