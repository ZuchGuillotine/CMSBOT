<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMSBOT review</title>
<style>

*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}

select,input[type=text],input[type=password],input[type=datetime-local],input[type=url],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;resize:vertical;min-height:38px}
input[type=text],input[type=url],.field input[type=password]{width:100%}
.tabs{display:flex;max-width:100%;overflow-x:auto;gap:2px;background:var(--chip);border-radius:8px;padding:2px}

#list{overflow:auto;border-right:1px solid var(--line)}
.row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row[aria-current=true]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.row .t{font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{display:flex;gap:5px;flex-wrap:wrap}
#detail{overflow:auto;padding:18px 22px 120px;max-width:900px}
.empty{color:var(--muted);padding:40px 20px;text-align:center}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.field{margin-bottom:10px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.group{border-left:2px solid var(--line);padding-left:12px;margin:6px 0 12px}
.entry{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.entry>.body{flex:1;min-width:0}
.count{font-size:11px;color:var(--muted);text-align:right}.count.over{color:var(--bad);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}.btn.small{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.note{border-radius:8px;padding:9px 12px;margin:8px 0}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--ok-bg)}
.claim{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;background:var(--panel)}
.claim .acts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.actions{position:fixed;bottom:0;right:0;left:min(360px,40vw);background:var(--panel);border-top:1px solid var(--line);padding:10px 22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

th{color:var(--muted);font-weight:500;font-size:12px}
details summary{cursor:pointer;color:var(--muted)}
.slides{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.slides .slide{flex:none;width:216px;height:270px;overflow:hidden;border-radius:8px;border:1px solid var(--line)}
.slides iframe{width:1080px;height:1350px;border:0;transform:scale(.2);transform-origin:0 0;pointer-events:none}
#login{max-width:380px;margin:12vh auto;background:var(--panel);padding:24px;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;top:14px;right:14px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:60vw}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#list{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}.actions{left:0}}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<div id="login" hidden>
  <h1 style="font-size:18px;margin-top:0">CMSBOT review</h1>
  <p style="color:var(--muted)">Paste your reviewer token. It stays in this browser.</p>
  <form id="loginForm"><input type="password" id="tokenInput" placeholder="cms_adm_…" style="width:100%" autocomplete="off">
  <p><button class="btn primary">Sign in</button></p></form>
  <form id="setupForm" hidden><p style="color:var(--muted)">This Hub is new. Enter the setup code from its log to create the first reviewer.</p>
  <div class="field"><label>Setup code</label><input type="text" id="setupCode" autocomplete="off"></div>
  <div class="field"><label>Your name (shown on approvals)</label><input type="text" id="setupName"></div>
  <p><button class="btn primary">Create reviewer</button></p></form>
  <div id="setupDone"></div>
</div>
<div id="app" hidden>
<header>
  <h1>CMSBOT</h1>
  <select id="project" aria-label="Project"></select>
  <div class="tabs" id="tabs" role="tablist"></div>
  <select id="channel" aria-label="Channel"><option value="">All channels</option></select>
  <span class="spacer"></span>
  <span class="chip" id="spend"></span>
  <button class="btn small" id="logout">Sign out</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select an item. Keys: <b>j</b>/<b>k</b> move, <b>Ctrl+Enter</b> approve.</div></div>
</main>
</div>
