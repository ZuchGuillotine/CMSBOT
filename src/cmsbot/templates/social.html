<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Social Content</title>
    <meta name="description" content="{{ description }}">

    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    {% if hero_image %}<meta property="og:image" content="{{ hero_image.file_path }}">{% endif %}

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-2: #242424;
            --text: #f5f5f5;
            --text-muted: #999;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --twitter: #1d9bf0;
            --linkedin: #0a66c2;
            --instagram: #e4405f;
            --border: #2a2a2a;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            --mono: 'SF Mono', 'Fira Code', monospace;
            --radius: 12px;
        }

        html { font-size: 16px; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Hero Image */
        .hero-card {
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .hero-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Platform Cards */
        .platform-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .platform-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
        }
        .platform-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .platform-dot.twitter { background: var(--twitter); }
        .platform-dot.linkedin { background: var(--linkedin); }
        .platform-dot.instagram { background: var(--instagram); }
        .platform-name {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .char-count {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .platform-body {
            padding: 1.25rem;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* Tags */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
        }
        .tag {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Main Content Section */
        .main-content {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .main-content h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--accent);
            font-weight: 600;
        }
        .main-content p {
            margin-bottom: 1rem;
            color: var(--text);
        }
        .main-content ul {
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .main-content li {
            margin-bottom: 0.5rem;
        }
        .main-content strong { font-weight: 600; }
        .main-content em { font-style: italic; }
        .main-content hr {
            border: none;
            height: 1px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ title }}</h1>
            <p class="subtitle">Social media content pack</p>
        </div>

        {% if hero_image and hero_image.file_path %}
        <div class="hero-card">
            <img src="{{ hero_image.file_path }}" alt="{{ hero_image.alt_text }}">
        </div>
        {% endif %}

        <div class="main-content">
            <h2>Core Content</h2>
            {{ body | safe }}
        </div>

        <footer class="footer">
            <p>Generated by CMSBOT &mdash; Multi-agent Autoreason Pipeline</p>
        </footer>
    </div>
</body>
</html>
