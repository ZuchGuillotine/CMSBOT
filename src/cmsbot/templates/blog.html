<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:type" content="article">
    {% if hero_image %}<meta property="og:image" content="{{ hero_image.file_path }}">{% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    {% if hero_image %}<meta name="twitter:image" content="{{ hero_image.file_path }}">{% endif %}

    <style>
        /* Reset & Base */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --color-bg: #fafaf9;
            --color-surface: #ffffff;
            --color-text: #1c1917;
            --color-text-secondary: #57534e;
            --color-accent: #b45309;
            --color-accent-light: #fef3c7;
            --color-border: #e7e5e4;
            --color-code-bg: #f5f5f4;
            --font-serif: 'Georgia', 'Times New Roman', 'Noto Serif', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            --max-width: 720px;
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2.5rem;
            --space-2xl: 4rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-bg: #0c0a09;
                --color-surface: #1c1917;
                --color-text: #fafaf9;
                --color-text-secondary: #a8a29e;
                --color-accent: #f59e0b;
                --color-accent-light: #451a03;
                --color-border: #292524;
                --color-code-bg: #292524;
            }
        }

        html { font-size: 18px; scroll-behavior: smooth; }

        body {
            font-family: var(--font-serif);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Layout */
        .article-wrapper {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-bottom: var(--space-2xl);
            overflow: hidden;
            max-height: 500px;
        }
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(transparent, var(--color-bg));
        }

        /* Typography */
        h1 {
            font-family: var(--font-sans);
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-md);
            color: var(--color-text);
        }

        h2 {
            font-family: var(--font-sans);
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-md);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--color-border);
            color: var(--color-text);
        }

        h3 {
            font-family: var(--font-sans);
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.4;
            margin-top: var(--space-xl);
            margin-bottom: var(--space-sm);
            color: var(--color-text);
        }

        p {
            margin-bottom: var(--space-lg);
            color: var(--color-text);
        }

        /* Links */
        a {
            color: var(--color-accent);
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color 0.15s;
        }
        a:hover { color: var(--color-text); }

        /* Lists */
        ul, ol {
            margin-bottom: var(--space-lg);
            padding-left: var(--space-xl);
        }
        li {
            margin-bottom: var(--space-sm);
        }
        li::marker {
            color: var(--color-accent);
        }

        /* Blockquotes */
        blockquote {
            border-left: 3px solid var(--color-accent);
            margin: var(--space-xl) 0;
            padding: var(--space-md) var(--space-lg);
            background: var(--color-accent-light);
            border-radius: 0 8px 8px 0;
        }
        blockquote p {
            font-style: italic;
            margin-bottom: 0;
            color: var(--color-text-secondary);
        }

        /* Code */
        code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--color-code-bg);
            padding: 0.15em 0.4em;
            border-radius: 4px;
        }
        pre {
            background: var(--color-code-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: var(--space-lg);
            overflow-x: auto;
            margin-bottom: var(--space-lg);
        }
        pre code {
            background: none;
            padding: 0;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        /* Images */
        .section-image {
            margin: var(--space-xl) 0;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            text-align: center;
        }
        .section-image img {
            max-width: 900px;
            width: 90%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        .section-image figcaption {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: var(--space-sm);
        }

        /* Horizontal Rule */
        hr {
            border: none;
            height: 1px;
            background: var(--color-border);
            margin: var(--space-2xl) 0;
        }

        /* Strong & Em */
        strong { font-weight: 700; }
        em { font-style: italic; }

        /* Footer */
        .article-footer {
            margin-top: var(--space-2xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--color-border);
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            html { font-size: 16px; }
            h1 { font-size: 2rem; }
            h2 { font-size: 1.3rem; }
            .article-wrapper { padding: var(--space-lg) var(--space-md); }
            .hero { max-height: 300px; }
            .section-image img { width: 100%; border-radius: 0; }
        }

        /* Print */
        @media print {
            body { background: white; color: black; font-size: 12pt; }
            .hero { max-height: 300px; }
            a { color: inherit; text-decoration: underline; }
            .article-footer { display: none; }
        }
    </style>
</head>
<body>
    {% if hero_image and hero_image.file_path %}
    <div class="hero">
        <img src="{{ hero_image.file_path }}" alt="{{ hero_image.alt_text }}">
    </div>
    {% endif %}

    <article class="article-wrapper">
        {{ body | safe }}

        <footer class="article-footer">
            <p>Generated by CMSBOT &mdash; Multi-agent Autoreason Pipeline</p>
        </footer>
    </article>
</body>
</html>
